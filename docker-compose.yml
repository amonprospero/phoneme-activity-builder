services:
  app:
    build: .
    environment:
      DATABASE_URL: file:/data/app.db
      NODE_ENV: production
    volumes:
      - phoneme-db:/data
    expose:
      - "3000"
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  phoneme-db:
